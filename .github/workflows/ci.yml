name: CI
on:
  push:
    branches:
      - main
      - beta
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  Foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
      - run: pnpm install --frozen-lockfile
        shell: bash
      - name: Restore Foundry build cache
        uses: actions/cache@v6
        with:
          path: |
            cache-foundry
            out
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml', 'foundry.lock', 'pnpm-lock.yaml', 'contracts/**/*.sol', 'test/**/*.sol', 'scripts/*.s.sol', 'lib/**/*.sol') }}
          restore-keys: |
            foundry-${{ runner.os }}-
      - name: Full fresh deployment smoke
        run: pnpm run deploy:foundry:smoke
        env:
          IS_BETA: "false"
      - name: Foundry tests
        run: forge test
