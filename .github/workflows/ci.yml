name: CI
on:
  push:
    branches:
      - main
      - beta
      - sonic
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  Foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: pnpm/action-setup@v4
      - name: Install packages
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        shell: bash
      - name: Restore Foundry build cache
        uses: actions/cache@v4
        with:
          path: |
            cache-foundry
            out
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml', 'foundry.lock', 'pnpm-lock.yaml', 'contracts/**/*.sol', 'test-foundry/**/*.sol', 'scripts/*.s.sol', 'lib/**/*.sol') }}
          restore-keys: |
            foundry-${{ runner.os }}-
      - name: Full beta deployment smoke
        run: pnpm run deploy:foundry
      - name: Foundry tests
        run: forge test
