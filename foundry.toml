[profile.default]
# Sonic's Brio hardfork raises the contract size limit (~48kb), so all profiles share the same
# optimizer settings. Only sources that exceed legacy-codegen stack limits use the via-ir profile.
src = "contracts"
test = "test-foundry"
out = "out"
cache_path = "cache-foundry"
libs = ["node_modules", "lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 9_999_999
via_ir = false
additional_compiler_profiles = [
  { name = "via-ir", via_ir = true },
]
compilation_restrictions = [
  { paths = "contracts/Bazaar/OrderBook.sol", via_ir = true },
  { paths = "contracts/PetNFTLibrary.sol", via_ir = true },
  { paths = "contracts/Clans/Clans.sol", via_ir = true },
  { paths = "contracts/Players/PlayersLibrary.sol", via_ir = true },
  { paths = "contracts/Clans/CombatantsHelper.sol", via_ir = true },
  { paths = "contracts/Clans/LockedBankVaultsLibrary.sol", via_ir = true },
  { paths = "contracts/Quests.sol", via_ir = true },
  { paths = "contracts/PlayerNFT.sol", via_ir = true },
  { paths = "contracts/PassiveActions.sol", via_ir = true },
  { paths = "contracts/Session/UsageBasedSessionModule.sol", via_ir = true },
  { paths = "contracts/test/LockedBankVaultsBattleResultDecoder.sol", via_ir = true },
]
libraries = [
  "contracts/EstforLibrary.sol:EstforLibrary:0x0000000000000000000000000000000000001001",
  "contracts/ItemNFTLibrary.sol:ItemNFTLibrary:0x0000000000000000000000000000000000001002",
  "contracts/PetNFTLibrary.sol:PetNFTLibrary:0x0000000000000000000000000000000000001003",
  "contracts/Players/PlayersLibrary.sol:PlayersLibrary:0x0000000000000000000000000000000000001004",
  "contracts/PromotionsLibrary.sol:PromotionsLibrary:0x0000000000000000000000000000000000001005",
  "contracts/Clans/ClanBattleLibrary.sol:ClanBattleLibrary:0x0000000000000000000000000000000000001006",
  "contracts/Clans/LockedBankVaultsLibrary.sol:LockedBankVaultsLibrary:0x0000000000000000000000000000000000001007",
]

# Required by openzeppelin-foundry-upgrades to run upgrade safety validations (the Foundry
# equivalent of @openzeppelin/hardhat-upgrades' checks, which rely on Hardhat's outputSelection
# storageLayout setting). build_info + storageLayout let the library read storage layouts from
# build info JSONs; ast is needed for @custom:oz-upgrades-from annotations; ffi lets the library
# invoke the OZ Upgrades CLI (Node.js) to run the actual validation.
# Run `forge clean` (or forge test/script with --force) after changing these, and before runs
# that validate upgrades, so build info is always freshly generated.
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./.forge-deploy-data" },
  { access = "read-write", path = "./.deployments" },
]

# Promotions owns a game function named testClearPlayerPromotions (an admin op to clear test
# promotions), which Foundry's collector mistakes for a fuzz test. Keep it out of test runs.
no_match_contract = "Promotions"

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
  "@paintswap/=node_modules/@paintswap/",
  # forge-std must be >= 1.9.5 for openzeppelin-foundry-upgrades (the nested copy in the OZ
  # submodule is older), so it is installed directly in lib/forge-std.
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
  "@layerzerolabs/test-devtools-evm-foundry/=node_modules/@layerzerolabs/test-devtools-evm-foundry/",
  "@layerzerolabs/lz-evm-protocol-v2/=node_modules/@layerzerolabs/lz-evm-protocol-v2/",
]
